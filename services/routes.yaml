caddy:
  acme_dns: cloudflare {env.CLOUDFLARE_API_TOKEN}

dns:
  lan_dns: 192.0.2.10
  tailscale_dns: 100.64.0.10
  carveouts:
    - domain: pangolin.home.example
      answer: 198.51.100.20
      note: remote VPS; bypasses local Caddy
  wildcards:
    - domain: "*.home.example"
      answer: 192.0.2.10
      note: Proxmox LAN IP; host DNAT forwards :80/:443 to rp-ct
    - domain: "*.internal.home.example"
      answer: 192.0.2.10
      note: Proxmox LAN IP; host DNAT forwards :80/:443 to rp-ct

entrypoints:
  proxmox_lan:
    interface: eth0
    address: 192.0.2.10
    dns_answer: 192.0.2.10
    # DNS terminates on a dedicated dnsmasq listener at this address. It is
    # forwarded to Pi-hole in userspace rather than DNATed across vmbr0.
    forward_dns: false
    forward_web: true
  proxmox_tailscale:
    interface: tailscale0
    address: 100.64.0.10
    dns_answer: 100.64.0.10
    forward_dns: false
    forward_web: true
  internal:
    dns_target:
      host: adguard-ct
      tcp_port: 53
      udp_port: 53
    web_target:
      host: rp-ct
      tcp_ports:
        - 80
        - 443
      udp_ports:
        - 443

services:
  - name: jellyfin
    upstream_host: jellyfin-ct
    upstream_port: 8096
    public_hosts:
      - jelly.home.example
    internal_hosts:
      - jelly.internal.home.example
    external: true
    caddy:
      flush_interval: "-1"

  - name: navidrome
    upstream_host: jellyfin-ct
    upstream_port: 4533
    public_hosts:
      - music.home.example
    internal_hosts:
      - music.internal.home.example
    external: true

  - name: requests
    upstream_host: apps-vm-1
    upstream_port: 5055
    public_hosts:
      - requests.home.example
    external: true

  - name: photos
    upstream_host: immich-ct
    upstream_port: 2283
    public_hosts:
      - photos.home.example
    internal_hosts:
      - photos.internal.home.example
    external: true

  - name: auth
    upstream_host: auth-vm-1
    upstream_port: 3055
    public_hosts:
      - auth.home.example
    external: true

  - name: recipes
    upstream_host: apps-ct
    upstream_port: 8089
    public_hosts:
      - recipes.home.example
    internal_hosts:
      - recipes.internal.home.example
    external: true
    caddy:
      headers:
        - header_up Host {host}
        - header_up X-Forwarded-Proto {scheme}

  - name: droppedneedle
    upstream_host: apps-vm-1
    upstream_port: 8688
    public_hosts:
      - groove.home.example
    internal_hosts:
