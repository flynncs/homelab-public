- name: Install required system packages
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Set Docker repo parameters
  ansible.builtin.set_fact:
    docker_repo_os: "{{ 'debian' if ansible_distribution | lower == 'debian' else 'ubuntu' }}"
    docker_repo_codename: "{{ ansible_distribution_release }}"

- name: Add Docker’s official GPG key
  become: true
  ansible.builtin.apt_key:
    url: "https://download.docker.com/linux/{{ docker_repo_os }}/gpg"
    state: present

- name: Add Docker APT repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/{{ docker_repo_os }} {{ docker_repo_codename }} stable"
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
